name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install CPU dependencies and app extras
        # Ignore the project's explicit CUDA source before selecting CPU wheels.
        # See https://docs.astral.sh/uv/guides/integration/pytorch/#automatic-backend-selection
        run: |
          uv venv --python 3.12
          uv pip install --no-sources --torch-backend cpu --group dev --editable '.[app]'
          uv pip check
          .venv/bin/python -c "import torch; assert torch.version.cuda is None, 'CI must use CPU PyTorch'"
      - name: Lint and check shell syntax
        run: |
          .venv/bin/python -m ruff check .
          for script_path in scripts/*.sh; do bash -n "$script_path"; done
      - name: Run all tests including app and training pipeline
        run: .venv/bin/python -m pytest -q
      - name: Check command-line entry point
        run: .venv/bin/serein --help

  website:
    # The site in website/ is built from website-src/ by hand and committed, so nothing
    # else would notice a change that no longer type checks or builds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website-src/package-lock.json
      - name: Type check and build the website from website-src
        working-directory: website-src
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build --outDir "$RUNNER_TEMP/site" --emptyOutDir
      - name: Check the fresh build's files and links
        run: python3 scripts/check_website.py "$RUNNER_TEMP/site"
