name: Publish website

# Publishes website/ to https://htvarkali.github.io/Serein/.
# The repository's Pages source must be GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "scripts/check_website.py"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      # Full reruns upload a new artifact. Deploy-only reruns reuse the package output.
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate website files and links
        run: python3 scripts/check_website.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: website

  deploy:
    # Artifact listing can lag behind upload finalization in the same job.
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}
