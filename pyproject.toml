[project]
name = "serein"
version = "0.1.0"
description = "Neighborhood-level wildfire smoke forecasts (1-3 days) with personal asthma risk plans for kids."
readme = "README.md"
authors = [{ name = "Team Serein" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "pyyaml>=6",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "xarray>=2024.1",
    "cfgrib>=0.9.14",
    "eccodes>=2.37",
    # Declare the native library explicitly: eccodes wheel metadata differs by platform.
    "eccodeslib; platform_system != 'Windows'",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "geopandas>=1.0",
    "torch>=2.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
app = ["streamlit>=1.38", "folium>=0.17", "streamlit-folium>=0.22"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
serein = "serein.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
